server:
  port: 9080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-swallow-size: 2MB
  max-http-request-header-size: 16KB

spring:
  application:
    name: mirage-mock
  profiles:
    active: ${MIRAGE_PROFILE:local}
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

mirage:
  http:
    enabled: true
    port: 19080
    timeout-hang-ms: 60000
    # Mock 请求体上限（字节），防超大 body 打爆内存
    max-body-bytes: 1048576
  security:
    jwt-secret: ${MIRAGE_JWT_SECRET:mirage-mock-dev-jwt-secret-please-change-in-prod-0123456789}
    jwt-ttl-hours: 12
    master-key: ${MIRAGE_MASTER_KEY:mirage-mock-dev-master-key}
  test:
    # 测试用例执行器目标地址策略（SSRF 防护）。多用户公网部署建议 block-private: true
    block-private: ${MIRAGE_TEST_BLOCK_PRIVATE:false}
    blocked-hosts:
      - 169.254.169.254
      - fd00:ec2::254
      - metadata.google.internal
      - metadata
  alert:
    # 定时回归失败告警（默认关闭；type: dingtalk/wecom/generic）
    enabled: ${MIRAGE_ALERT_ENABLED:false}
    webhook-url: ${MIRAGE_ALERT_WEBHOOK:}
    type: ${MIRAGE_ALERT_TYPE:generic}
    keyword: ${MIRAGE_ALERT_KEYWORD:}

logging:
  level:
    com.miragemock: INFO
    org.flywaydb: WARN
